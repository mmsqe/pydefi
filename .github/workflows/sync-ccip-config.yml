name: Sync CCIP config

on:
  schedule:
    # Mondays 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch upstream snapshot
        run: |
          curl -fsSL 'https://docs.chain.link/api/ccip/v1/chains?environment=mainnet' \
            | jq '.' \
            > /tmp/ccip-new.json

      # Upstream stamps every response with a fresh metadata.timestamp / requestId,
      # so diff only the `.data` payload to decide whether to open a PR.
      - name: Diff against on-disk snapshot
        id: drift
        run: |
          OLD=$(jq -S '.data' pydefi/config/ccip-chains.json)
          NEW=$(jq -S '.data' /tmp/ccip-new.json)
          if [ "$OLD" = "$NEW" ]; then
            echo "drift=none" >> "$GITHUB_OUTPUT"
          else
            mv /tmp/ccip-new.json pydefi/config/ccip-chains.json
            echo "drift=data" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR on data drift
        if: steps.drift.outputs.drift == 'data'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Problem: CCIP config out of sync with upstream"
          title: "Problem: CCIP config out of sync with upstream"
          body: |
            Automated refresh of `pydefi/config/ccip-chains.json` from
            `docs.chain.link/api/ccip/v1/chains?environment=mainnet`.

            Generated by `.github/workflows/sync-ccip-config.yml`.
          branch: sync/ccip-config
          delete-branch: true
          add-paths: |
            pydefi/config/ccip-chains.json
